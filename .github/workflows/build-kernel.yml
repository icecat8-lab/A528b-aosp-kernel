name: Build Kernel (clang-19 / r530567)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git-lfs curl device-tree-compiler

      - name: Cache clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang-19
          key: clang-r530567-linux-x86

      - name: Download clang 19 (r530567) toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b llvm-r530567 --depth 1 toolchain/clang-19

      - name: Locate clang binary
        id: find-clang
        run: |
          CLANG_BIN=$(find toolchain/clang-19 -maxdepth 2 -type d -name "bin" -path "*r530567*" | head -n1)
          if [ -z "$CLANG_BIN" ]; then
            echo "::error::clang-r530567 directory not found in toolchain/clang-19"
            find toolchain/clang-19 -maxdepth 1 -type d
            exit 1
          fi
          echo "Found: $CLANG_BIN"
          echo "clang_dir=$(dirname $CLANG_BIN)" >> "$GITHUB_OUTPUT"

      - name: Verify clang version
        run: |
          ${{ steps.find-clang.outputs.clang_dir }}/bin/clang --version

      - name: Restore script permissions
        run: |
          chmod +x build_kernel.sh
          find scripts -type f \( -name "*.py" -o -name "*.sh" -o -name "*.pl" \) -exec chmod +x {} \;
          find tools -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      - name: Build kernel
        run: |
          export PATH=${{ steps.find-clang.outputs.clang_dir }}/bin:$PATH
          ./build_kernel.sh

      - name: Collect built modules
        run: |
          mkdir -p out_modules
          find out -name "*.ko" -exec cp {} out_modules/ \;
          ls -la out_modules/

      - name: Upload Image + dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload kernel modules (.ko)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out_modules/*.ko
          if-no-files-found: warn

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/.config
