name: Build Kernel (clang-r530567)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git-lfs curl device-tree-compiler wget tar

      - name: Cache clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang-r530567
          key: clang-r530567-linux-x86

      - name: Download clang r530567 toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang-r530567
          wget https://googlesource.com
          tar -C toolchain/clang-r530567 -xf clang-r530567.tar.gz
          rm clang-r530567.tar.gz


      - name: Set permissions and verify clang version
        run: |
          # บังคับสิทธิ์ให้ไฟล์ใน bin สามารถ Run ได้ (ป้องกันปัญหา Permission Denied บน GitHub Actions)
          chmod +x toolchain/clang-r530567/bin/*
          toolchain/clang-r530567/bin/clang --version

      - name: Restore script permissions
        run: |
          chmod +x build_kernel.sh
          find scripts -type f \( -name "*.py" -o -name "*.sh" -o -name "*.pl" \) -exec chmod +x {} \;
          find tools -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      - name: Patch defconfig (cleanup)
        run: |
          DEFCONFIG=arch/arm64/configs/vendor/a52sxq_eur_open_defconfig
          # ลบ CONFIG_CLANG_VERSION ออกเพื่อให้ระบบคำนวณใหม่ตาม Clang ตัวที่ใช้จริง
          sed -i '/CONFIG_CLANG_VERSION/d' "$DEFCONFIG"
          # ปิดการทำงานแพลตฟอร์มอื่นที่ไม่เกี่ยวข้องออกเพื่อความรวดเร็ว
          sed -i \
            -e 's/^CONFIG_ARCH_SUNXI=y/# CONFIG_ARCH_SUNXI is not set/' \
            -e 's/^CONFIG_ARCH_ALLWINNER=y/# CONFIG_ARCH_ALLWINNER is not set/' \
            -e 's/^CONFIG_OF_ALL_DTBS=y/# CONFIG_OF_ALL_DTBS is not set/' \
            -e 's/^CONFIG_COMPILE_TEST=y/# CONFIG_COMPILE_TEST is not set/' \
            "$DEFCONFIG"
          echo "--- symbols after patch ---"
          grep -nE "ARCH_SUNXI|ARCH_ALLWINNER|OF_ALL_DTBS|COMPILE_TEST|CLANG_VERSION" "$DEFCONFIG" || true

      - name: Build kernel
        run: |
          # ส่ง PATH ของคอมไพเลอร์ที่โหลดมาเข้าไปในตัวแปรระบบหลักก่อนรันสคริปต์
          export PATH=$GITHUB_WORKSPACE/toolchain/clang-r530567/bin:$PATH
          ./build_kernel.sh

      - name: Collect built modules
        run: |
          mkdir -p out_modules
          find out -name "*.ko" -exec cp {} out_modules/ \;
          ls -la out_modules/

      - name: Upload Image + dtb/dtbo
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn

      - name: Upload kernel modules (.ko)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out_modules/*.ko
          if-no-files-found: warn

      - name: Upload build config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: out/.config
